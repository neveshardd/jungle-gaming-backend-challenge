server {
  listen 80;
  root /usr/share/nginx/html;

  # Same contract as the Vite dev proxy: /api/* -> API load balancer (prefix stripped).
  location /api/ {
    proxy_pass http://lb:8080/;
    proxy_set_header Host $host;
    proxy_set_header X-Correlation-Id $http_x_correlation_id;
  }

  location / {
    try_files $uri /index.html;
  }
}
