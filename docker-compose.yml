name: wagering

x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: info
  DATABASE_URL: postgres://wagering:wagering@postgres:5432/wagering
  DB_POOL_MAX: '20'
  AWS_REGION: us-east-1
  AWS_ENDPOINT_URL: http://localstack:4566
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  SQS_AUTO_CREATE: 'true'
  SQS_INPUT_QUEUE: wager-transactions.fifo
  SQS_DLQ: wager-transactions-dlq.fifo
  SQS_EVENTS_QUEUE: wallet-events.fifo
  OTEL_ENABLED: ${OTEL_ENABLED:-false}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
      POSTGRES_DB: wagering
    command: ['postgres', '-c', 'max_connections=300']
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wagering -d wagering']
      interval: 2s
      timeout: 3s
      retries: 30

  localstack:
    image: localstack/localstack:3.8.1
    environment:
      SERVICES: sqs
      SQS_ENDPOINT_STRATEGY: path
    ports:
      - '4566:4566'
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:4566/_localstack/health | grep -q sqs']
      interval: 3s
      timeout: 3s
      retries: 40

  migrate:
    build: .
    command: ['bun', 'src/infrastructure/database/migrate.ts', 'up']
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  app:
    build: .
    environment:
      <<: *app-env
      APP_ROLE: all
      PORT: '3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy
    deploy:
      replicas: 3
    stop_grace_period: 30s
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "fetch('http://localhost:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  lb:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - '8080:8080'
    depends_on:
      app:
        condition: service_healthy

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    profiles: ['otel']
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
      - '16686:16686'
      - '4318:4318'

  # Runs the whole test suite inside Linux (real Postgres + LocalStack):
  #   docker compose --profile test run --rm tests
  tests:
    build: .
    profiles: ['test']
    command: ['bun', 'test', '--timeout', '240000']
    environment:
      NODE_ENV: test
      TEST_DATABASE_URL: postgres://wagering:wagering@postgres:5432/wagering_test
      AWS_ENDPOINT_URL: http://localstack:4566
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

volumes:
  pgdata:
