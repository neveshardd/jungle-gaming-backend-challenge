events {}

http {
  # Docker's embedded DNS returns one A record per replica of "app";
  # nginx round-robins between them.
  upstream wagering_app {
    server app:3000;
  }

  server {
    listen 8080;

    location / {
      proxy_pass http://wagering_app;
      proxy_set_header Host $host;
      proxy_set_header X-Correlation-Id $http_x_correlation_id;
      proxy_next_upstream off; # never replay non-idempotent POSTs on another replica
    }
  }
}
